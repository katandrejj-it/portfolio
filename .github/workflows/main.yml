name: mtproxy_checker update

on:
  schedule:
    - cron: '0 8 * * *'  # каждый день 08:00 UTC
  workflow_dispatch:   # кнопка «Run workflow» вручную

jobs:
  update-proxies:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13

    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install -r mtproxy_checker/requirements.txt

    - name: Run checker
      run: |
        cd mtproxy_checker
        python main.py

    - name: Commit and push result
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add mtproxy_checker/proxies.json
        git diff --quiet --exit-code || git commit -m "Auto-update proxies.json"
        git push
