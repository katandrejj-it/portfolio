name: Update MTProxy list

on:
  schedule:
    - cron: "0 * * * *" # every 60 minutes
  workflow_dispatch: {}

jobs:
  update-proxies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r mtproxy_checker/requirements.txt

      - name: Run MTProto proxy checker
        run: python mtproxy_checker/main.py

      - name: Commit and push updated proxies.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mtproxy_checker/proxies.json
          if ! git diff --cached --quiet; then
            git commit -m "Update proxies.json [ci skip]"
            git push
          else
            echo "No changes to commit"
          fi
